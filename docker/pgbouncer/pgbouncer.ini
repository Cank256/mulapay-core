; Development PgBouncer in transaction mode, matching production (spec section 2).
; Transaction mode is why the application never relies on session state.
[databases]
mulapay = host=postgres port=5432 dbname=mulapay

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
max_prepared_statements = 0
ignore_startup_parameters = extra_float_digits
server_reset_query =
admin_users =
